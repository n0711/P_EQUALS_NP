name: SAT research verification

on:
  push:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"
  pull_request:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"

permissions:
  contents: read

jobs:
  python-sat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent SAT regressions
        run: python -m unittest -v test_sat.py test_frontier_sat.py test_component_sat.py test_proof_obligations.py
