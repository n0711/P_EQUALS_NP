name: SAT research verification

on:
  push:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "graph_separator_sat.py"
      - "structural_hybrid_sat.py"
      - "mixed_affine_sat.py"
      - "run_m6_backdoor_benchmark.py"
      - "graph_research_instances.py"
      - "run_structural_benchmark.py"
      - "run_graph_separator_benchmark.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_graph_separator_sat.py"
      - "test_structural_hybrid_sat.py"
      - "test_mixed_affine_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"
  pull_request:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "graph_separator_sat.py"
      - "structural_hybrid_sat.py"
      - "mixed_affine_sat.py"
      - "run_m6_backdoor_benchmark.py"
      - "graph_research_instances.py"
      - "run_structural_benchmark.py"
      - "run_graph_separator_benchmark.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_graph_separator_sat.py"
      - "test_structural_hybrid_sat.py"
      - "test_mixed_affine_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"

permissions:
  contents: read

jobs:
  python-sat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent SAT regressions
        run: python -m unittest -v test_sat.py test_frontier_sat.py test_component_sat.py test_graph_separator_sat.py test_structural_hybrid_sat.py test_mixed_affine_sat.py test_proof_obligations.py
      - name: Reproduce graph-separator benchmark
        run: python run_graph_separator_benchmark.py --max-calls 50000 > graph-separator-ci-results.json
      - name: Upload CI benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: graph-separator-results
          path: graph-separator-ci-results.json
      - name: Reproduce bounded structural benchmark
        run: python run_structural_benchmark.py --quick --max-calls 1200 --timeout-seconds 3 > structural-ci-results.json
      - name: Upload bounded structural benchmark
        uses: actions/upload-artifact@v4
        with:
          name: structural-sat-results
          path: structural-ci-results.json
      - name: Run bounded M6 mixed-affine backdoor comparison
        run: python run_m6_backdoor_benchmark.py --quick --max-calls 2500 --timeout-seconds 3 > mixed-affine-ci-results.json
      - name: Upload reproducible M6 results
        uses: actions/upload-artifact@v4
        with:
          name: mixed-affine-m6-results
          path: mixed-affine-ci-results.json
          if-no-files-found: error
