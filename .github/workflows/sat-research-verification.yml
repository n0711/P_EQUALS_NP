name: SAT research verification

on:
  push:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "graph_separator_sat.py"
      - "structural_hybrid_sat.py"
      - "polarity_sat.py"
      - "dense_cnf_families.py"
      - "run_polarity_benchmark.py"
      - "graph_research_instances.py"
      - "run_structural_benchmark.py"
      - "run_graph_separator_benchmark.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_graph_separator_sat.py"
      - "test_structural_hybrid_sat.py"
      - "test_polarity_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"
  pull_request:
    paths:
      - "sat.py"
      - "frontier_sat.py"
      - "component_sat.py"
      - "graph_separator_sat.py"
      - "structural_hybrid_sat.py"
      - "polarity_sat.py"
      - "dense_cnf_families.py"
      - "run_polarity_benchmark.py"
      - "graph_research_instances.py"
      - "run_structural_benchmark.py"
      - "run_graph_separator_benchmark.py"
      - "test_sat.py"
      - "test_frontier_sat.py"
      - "test_component_sat.py"
      - "test_graph_separator_sat.py"
      - "test_structural_hybrid_sat.py"
      - "test_polarity_sat.py"
      - "test_proof_obligations.py"
      - ".github/workflows/sat-research-verification.yml"

permissions:
  contents: read

jobs:
  python-sat-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run independent SAT regressions
        run: python -m unittest -v test_sat.py test_frontier_sat.py test_component_sat.py test_graph_separator_sat.py test_structural_hybrid_sat.py test_polarity_sat.py test_proof_obligations.py
      - name: Reproduce graph-separator benchmark
        run: python run_graph_separator_benchmark.py --max-calls 50000 > graph-separator-ci-results.json
      - name: Upload CI benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: graph-separator-results
          path: graph-separator-ci-results.json
      - name: Reproduce bounded structural benchmark
        run: python run_structural_benchmark.py --quick --max-calls 1200 --timeout-seconds 3 > structural-ci-results.json
      - name: Upload bounded structural benchmark
        uses: actions/upload-artifact@v4
        with:
          name: structural-sat-results
          path: structural-ci-results.json
      - name: Reproduce M6 same-graph counterfamily benchmark
        run: python run_polarity_benchmark.py --quick --timeout-seconds 3 --max-calls 1800 > m6-polarity-results.json
      - name: Upload M6 counterfamily benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: m6-same-primal-graph-results
          path: m6-polarity-results.json
          if-no-files-found: error
